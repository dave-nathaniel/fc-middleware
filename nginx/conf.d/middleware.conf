# FC Middleware behind NGINX (HTTP).
# For HTTPS, see middleware-https.conf.example in this folder.

upstream middleware_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    charset utf-8;

    # Store configuration spreadsheets are uploaded through the admin.
    client_max_body_size 20m;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Collected admin/DRF assets and uploads, served straight from the shared volumes.
    location /static/ {
        alias /app/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # Liveness of the proxy itself, for load balancers and uptime checks.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Everything else is Django: /api/v1/ (incl. /api/v1/pos/), /srp-feed/ and /admin/.
    location / {
        proxy_pass http://middleware_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
